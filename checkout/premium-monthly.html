<title>Premium — Monthly | Run With The Winners</title>
<link rel="icon" type="image/png" href="../logo.png">

<style>
body {
  background-color: #080706;
  background-image:
    radial-gradient(rgba(246,235,212,0.5) 0.5px, rgba(246,235,212,0) 0.6px),
    radial-gradient(64% 46% at 88% 4%, rgba(245,197,66,0.16) 0%, rgba(224,160,60,0.06) 34%, rgba(224,160,60,0) 70%);
  background-size: 3px 3px, auto;
  background-attachment: fixed;
}
:root {
  --gold: #f5c542;
  --black: #080706;
  --card: #100e0b;
  --white: #f2ece1;
  --gray: rgba(242,236,225,0.55);
  --green: #ffe08a;
  --accent: #a8b4bc;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Archivo', sans-serif; font-variation-settings: 'wdth' 100;
  background: var(--black);
  color: var(--white);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 20px;
  -webkit-font-smoothing: antialiased;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  top: -40%;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(245,197,66,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.back-link {
  align-self: flex-start;
  color: var(--gray);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 24px;
  transition: color 0.2s;
}
.back-link:hover { color: var(--white); }
.checkout-header {
  text-align: center;
  margin-bottom: 24px;
}
.checkout-icon { font-size: 40px; margin-bottom: 8px; }
.checkout-title {
  font-family: 'Archivo', sans-serif; font-variation-settings: 'wdth' 110; font-weight: 800; text-transform: uppercase; letter-spacing: -0.015em;
  font-size: 32px;
  letter-spacing: 1px;
}
.checkout-freq {
  display: inline-block;
  margin-top: 6px;
  padding: 4px 14px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border: 1px solid var(--accent);
  color: var(--accent);
}
.checkout-embed-wrapper {
  width: 100%;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  min-height: 500px;
}
.checkout-embed-wrapper > div {
  min-height: 500px;
}
.trust-row {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 24px;
}
.trust-item {
  font-size: 11px;
  color: var(--gray);
  display: flex;
  align-items: center;
  gap: 4px;
}
.trust-item .check { color: var(--green); font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
<div class="page">
  <a href="../index.html" class="back-link">← Back</a>
  <div class="checkout-header">
    <div class="checkout-icon">💎</div>
    <div class="checkout-title">Premium</div>
    <span class="checkout-freq">Monthly — $99.99/mo</span>
  </div>
  <div class="checkout-embed-wrapper">
    <div
      data-whop-checkout-plan-id="plan_yVSMf6AiOityO"
      data-whop-checkout-return-url="../index.html"
    ></div>
  </div>
  <div class="trust-row">
    <span class="trust-item"><span class="check">✓</span> Secure checkout</span>
    <span class="trust-item"><span class="check">✓</span> Cancel anytime</span>
    <span class="trust-item"><span class="check">✓</span> Instant access</span>
  </div>
</div>
<!-- Meta Pixel - ViewContent for Monthly tier -->
<script>
  fbq('track', 'ViewContent', {
    value: 99.99,
    currency: 'USD',
    content_name: 'RWTW Premium Monthly',
    content_ids: ['rwtw-premium-monthly'],
    content_type: 'product',
    content_category: 'subscription'
  });
</script>
